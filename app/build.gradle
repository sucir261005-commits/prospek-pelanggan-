plugins {
    id "com.android.application"
}

android {
    namespace "com.neosantara.prospek"
    compileSdk 34

    defaultConfig {
        applicationId "com.neosantara.prospek"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", "\"${providers.gradleProperty('PROSPECT_API_BASE_URL').getOrElse('http://127.0.0.1:8000/api/')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-stdlib:1.8.10",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10"
    )
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.lifecycle:lifecycle-livedata:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
}
